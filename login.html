<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f7f3">
  <link rel="canonical" href="https://sistemadebodegas.vercel.app/login.html">
  <meta name="description" content="Acceso al sistema web de administración de bodegas para gestionar inventario, registrar ventas y consultar reportes.">
  <title>Iniciar sesión — Mercado</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Iniciar sesión — Mercado",
    "url": "https://sistemadebodegas.vercel.app/login.html",
    "description": "Página de acceso al sistema de administración de bodegas Mercado.",
    "inLanguage": "es",
    "isPartOf": {
      "@type": "WebSite",
      "name": "Sistema de Bodegas — Mercado",
      "url": "https://sistemadebodegas.vercel.app/"
    }
  }
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="login.css">
  <script src="js/auth.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="login-page">
  <video class="login-background-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1">
    <source src="video/Supermercados%20La%20Roca%20Video%20Comercial.mp4" type="video/mp4">
  </video>
  <div class="login-video-overlay" aria-hidden="true"></div>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <a class="login-brand" href="login.html" aria-label="Mercado, inicio">
        <span class="brand-mark">m</span>
        <span class="brand-name">mercado</span>
      </a>
      <div class="login-intro">
        <p class="login-eyebrow">PANEL DE ADMINISTRACIÓN</p>
        <h1 id="login-title">Qué bueno verte</h1>
        <p>Inicia sesión para administrar tu tienda.</p>
      </div>
      <form id="login-form" class="login-form">
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus placeholder="Ingresa tu usuario">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Ingresa tu contraseña">
            <button type="button" class="password-toggle" id="toggle-password" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
        </div>
        <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
        <button class="button primary login-submit" type="submit">Iniciar sesión <span aria-hidden="true">→</span></button>
      </form>
      <p class="login-footnote">Acceso para personal autorizado de la tienda.</p>
    </section>
    <p class="login-copyright">Mercado · Administración de tienda</p>
  </main>
</body>
</html>
